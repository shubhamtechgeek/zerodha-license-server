<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Admin — Zerodha Portfolio Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#0a0a0a;--card:#151515;--border:#2a2a2a;--text:#e0e0e0;
               --muted:#888;--accent:#60a5fa;--success:#4ade80;--danger:#f87171;
               --warning:#fbbf24;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

        /* ── Login overlay ─────────────────────────────── */
        #login-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;
            display:flex;align-items:center;justify-content:center;}
        #login-overlay .card{background:var(--card);border:1px solid var(--border);
            border-radius:12px;padding:40px;width:360px;text-align:center;}
        #login-overlay h2{margin-bottom:20px;font-size:20px;}
        #login-overlay input{width:100%;padding:10px 14px;background:#0d0d0d;
            border:1px solid var(--border);border-radius:8px;color:var(--text);
            font-size:14px;margin-bottom:16px;}
        #login-overlay input:focus{outline:none;border-color:var(--accent);}
        #login-overlay button{width:100%;padding:10px;background:var(--accent);
            color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer;}
        #login-error{color:var(--danger);font-size:13px;margin-top:8px;display:none;}

        /* ── Main layout ───────────────────────────────── */
        .header{padding:20px 32px;border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;}
        .header h1{font-size:20px;font-weight:700;}
        .header .admin-badge{background:#1e3a5f;color:var(--accent);padding:4px 12px;
            border-radius:20px;font-size:12px;font-weight:500;}
        .main{padding:24px 32px;max-width:1400px;margin:0 auto;}

        /* ── Stats bar ─────────────────────────────────── */
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:16px;margin-bottom:28px;}
        .stat-card{background:var(--card);border:1px solid var(--border);
            border-radius:10px;padding:20px;}
        .stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;
            letter-spacing:0.5px;margin-bottom:6px;}
        .stat-card .value{font-size:28px;font-weight:700;}
        .stat-card .value.green{color:var(--success);}
        .stat-card .value.blue{color:var(--accent);}
        .stat-card .value.red{color:var(--danger);}

        /* ── Toolbar ───────────────────────────────────── */
        .toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
        .toolbar input{padding:8px 14px;background:#0d0d0d;border:1px solid var(--border);
            border-radius:8px;color:var(--text);font-size:13px;width:280px;}
        .toolbar input:focus{outline:none;border-color:var(--accent);}
        .toolbar select{padding:8px 12px;background:#0d0d0d;border:1px solid var(--border);
            border-radius:8px;color:var(--text);font-size:13px;}
        .btn{padding:8px 18px;border:none;border-radius:8px;font-size:13px;
            font-weight:600;cursor:pointer;transition:opacity .2s;}
        .btn-blue{background:var(--accent);color:#000;}
        .btn-green{background:var(--success);color:#000;}
        .btn-red{background:var(--danger);color:#000;}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
        .btn:hover{opacity:0.85;}

        /* ── Table ─────────────────────────────────────── */
        .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;
            background:var(--card);}
        table{width:100%;border-collapse:collapse;font-size:13px;}
        th{text-align:left;padding:12px 16px;color:var(--muted);font-weight:500;
            border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;
            letter-spacing:0.5px;}
        td{padding:10px 16px;border-bottom:1px solid #1a1a1a;vertical-align:middle;}
        tr:last-child td{border-bottom:none;}
        tr:hover{background:#1a1a1a;}

        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
            font-weight:600;}
        .badge-active{background:#14532d55;color:var(--success);}
        .badge-disabled{background:#7f1d1d55;color:var(--danger);}
        .badge-expired{background:#78350f55;color:var(--warning);}
        .badge-unactivated{background:#1e293b55;color:var(--muted);}

        .key-mono{font-family:'Courier New',monospace;font-size:12px;letter-spacing:0.5px;
            color:var(--accent);}
        .email-text{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .actions-cell{display:flex;gap:6px;flex-wrap:wrap;}
        .btn-sm{padding:4px 10px;font-size:11px;border-radius:6px;}

        /* ── Modal ─────────────────────────────────────── */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
            display:none;align-items:center;justify-content:center;}
        .modal-overlay.show{display:flex;}
        .modal{background:var(--card);border:1px solid var(--border);border-radius:12px;
            padding:32px;width:420px;max-width:90vw;max-height:80vh;overflow-y:auto;}
        .modal h3{margin-bottom:20px;font-size:18px;}
        .modal .form-group{margin-bottom:16px;}
        .modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
        .modal input,.modal select,.modal textarea{width:100%;padding:8px 12px;
            background:#0d0d0d;border:1px solid var(--border);border-radius:8px;
            color:var(--text);font-size:13px;font-family:inherit;}
        .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;
            border-color:var(--accent);}
        .modal textarea{resize:vertical;min-height:60px;}
        .modal-footer{display:flex;gap:12px;margin-top:20px;justify-content:flex-end;}

        /* Key display */
        .key-display{background:#0d0d0d;border:1px solid var(--accent);border-radius:8px;
            padding:16px;text-align:center;font-family:monospace;font-size:20px;
            letter-spacing:2px;color:var(--accent);margin:16px 0;cursor:pointer;}
        .key-display:hover::after{content:' (click to copy)';font-size:11px;color:var(--muted);}

        .toast{position:fixed;bottom:24px;right:24px;background:var(--card);
            border:1px solid var(--border);border-radius:8px;padding:12px 20px;
            font-size:13px;z-index:200;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5);}
        .toast.show{display:block;}
    </style>
</head>
<body>

<!-- Login -->
<div id="login-overlay">
    <div class="card">
        <h2>🔐 Admin Login</h2>
        <input type="password" id="admin-key-input" placeholder="Admin API Key" autofocus>
        <button onclick="doLogin()">Login</button>
        <div id="login-error">Invalid API key</div>
    </div>
</div>

<!-- Header -->
<div class="header" id="main-content" style="display:none;">
    <h1>📊 License Admin</h1>
    <span class="admin-badge">Admin Panel</span>
</div>

<div class="main" id="main-body" style="display:none;">
    <!-- Stats -->
    <div class="stats" id="stats-bar">
        <div class="stat-card"><div class="label">Total Licenses</div><div class="value blue" id="stat-total">—</div></div>
        <div class="stat-card"><div class="label">Active</div><div class="value green" id="stat-active">—</div></div>
        <div class="stat-card"><div class="label">Expired</div><div class="value red" id="stat-expired">—</div></div>
        <div class="stat-card"><div class="label">Activations Today</div><div class="value" id="stat-today">—</div></div>
        <div class="stat-card"><div class="label">Revenue (Month)</div><div class="value green" id="stat-revenue">—</div></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <input type="text" id="search-input" placeholder="Search by email or key...">
        <select id="status-filter">
            <option value="">All</option>
            <option value="active">Active</option>
            <option value="inactive">Disabled</option>
            <option value="expired">Expired</option>
            <option value="unactivated">Unactivated</option>
        </select>
        <button class="btn btn-blue" onclick="loadLicenses()">🔄 Refresh</button>
        <button class="btn btn-green" onclick="showCreateModal()">+ New License</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Email</th><th>License Key</th><th>Plan</th><th>Status</th>
                    <th>Machine</th><th>Activated</th><th>Expires</th><th>Last Verified</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="license-table"></tbody>
        </table>
    </div>
</div>

<!-- Create License Modal -->
<div class="modal-overlay" id="create-modal">
    <div class="modal">
        <h3>Create New License</h3>
        <div class="form-group"><label>Email</label><input type="email" id="create-email" placeholder="user@example.com"></div>
        <div class="form-group"><label>Plan</label>
            <select id="create-plan"><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="lifetime">Lifetime</option></select>
        </div>
        <div class="form-group"><label>Notes</label><textarea id="create-notes" placeholder="Optional notes..."></textarea></div>
        <div id="created-key-display" style="display:none;">
            <div class="key-display" id="created-key" onclick="copyKey(this)"></div>
            <p style="text-align:center;color:var(--muted);font-size:12px;">Click to copy</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('create-modal')">Close</button>
            <button class="btn btn-green" id="create-btn" onclick="createLicense()">Create</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let API_KEY = '';

function doLogin() {
    API_KEY = document.getElementById('admin-key-input').value.trim();
    if (!API_KEY) return;
    // Test the key with a stats request
    fetch('/admin/api/stats', { headers: { 'X-Admin-Key': API_KEY } })
        .then(r => {
            if (r.ok) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
                document.getElementById('main-body').style.display = 'block';
                loadStats();
                loadLicenses();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        })
        .catch(() => { document.getElementById('login-error').style.display = 'block'; });
}
document.getElementById('admin-key-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function headers() { return { 'X-Admin-Key': API_KEY, 'Content-Type': 'application/json' }; }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function badge(lic) {
    const now = new Date();
    if (!lic.is_active) return '<span class="badge badge-disabled">Disabled</span>';
    if (lic.expires_at && new Date(lic.expires_at) < now) return '<span class="badge badge-expired">Expired</span>';
    if (!lic.hw_fingerprint) return '<span class="badge badge-unactivated">Unactivated</span>';
    return '<span class="badge badge-active">Active</span>';
}

async function loadStats() {
    try {
        const r = await fetch('/admin/api/stats', { headers: headers() });
        const d = await r.json();
        document.getElementById('stat-total').textContent = d.total_licenses;
        document.getElementById('stat-active').textContent = d.active_licenses;
        document.getElementById('stat-expired').textContent = d.expired_licenses;
        document.getElementById('stat-today').textContent = d.activations_today;
        const rev = (d.revenue_this_month_paise / 100).toLocaleString('en-IN', { style:'currency', currency:'INR' });
        document.getElementById('stat-revenue').textContent = rev;
    } catch(e) { console.error(e); }
}

async function loadLicenses() {
    const search = document.getElementById('search-input').value.trim();
    const status = document.getElementById('status-filter').value;
    let url = '/admin/api/licenses?';
    if (search) url += 'search=' + encodeURIComponent(search) + '&';
    if (status) url += 'status=' + encodeURIComponent(status);
    try {
        const r = await fetch(url, { headers: headers() });
        const licenses = await r.json();
        renderTable(licenses);
    } catch(e) { console.error(e); }
}

function renderTable(licenses) {
    const tbody = document.getElementById('license-table');
    if (!licenses.length) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:32px;">No licenses found</td></tr>'; return; }
    tbody.innerHTML = licenses.map(lic => `
        <tr>
            <td class="email-text" title="${lic.email}">${lic.email}</td>
            <td><span class="key-mono">${lic.license_key}</span></td>
            <td>${lic.plan}</td>
            <td>${badge(lic)}</td>
            <td>${lic.machine_name || '—'}</td>
            <td>${fmtDate(lic.activated_at)}</td>
            <td>${fmtDate(lic.expires_at)}</td>
            <td>${fmtDate(lic.last_verified)}</td>
            <td><div class="actions-cell">
                <button class="btn btn-sm ${lic.is_active ? 'btn-red' : 'btn-green'}"
                    onclick="toggleLicense('${lic.id}', ${!lic.is_active})">
                    ${lic.is_active ? 'Disable' : 'Enable'}
                </button>
                <button class="btn btn-sm btn-outline" onclick="resetHW('${lic.id}')">Reset HW</button>
            </div></td>
        </tr>
    `).join('');
}

async function toggleLicense(id, isActive) {
    try {
        await fetch('/admin/api/license/toggle', { method:'POST', headers:headers(),
            body:JSON.stringify({ license_id:id, is_active:isActive }) });
        showToast(isActive ? 'License enabled' : 'License disabled');
        loadLicenses(); loadStats();
    } catch(e) { showToast('Error: ' + e.message); }
}

async function resetHW(id) {
    if (!confirm('Reset hardware binding? The user will need to re-activate.')) return;
    try {
        await fetch('/admin/api/license/reset-hw', { method:'POST', headers:headers(),
            body:JSON.stringify({ license_id:id }) });
        showToast('Hardware binding reset');
        loadLicenses();
    } catch(e) { showToast('Error: ' + e.message); }
}

function showCreateModal() {
    document.getElementById('created-key-display').style.display = 'none';
    document.getElementById('create-btn').style.display = 'inline-block';
    document.getElementById('create-email').value = '';
    document.getElementById('create-notes').value = '';
    document.getElementById('create-modal').classList.add('show');
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

async function createLicense() {
    const email = document.getElementById('create-email').value.trim();
    const plan = document.getElementById('create-plan').value;
    const notes = document.getElementById('create-notes').value.trim();
    if (!email) { showToast('Email is required'); return; }
    try {
        const r = await fetch('/admin/api/license/create', { method:'POST', headers:headers(),
            body:JSON.stringify({ email, plan, notes: notes || null }) });
        const lic = await r.json();
        if (r.ok) {
            document.getElementById('created-key').textContent = lic.license_key;
            document.getElementById('created-key-display').style.display = 'block';
            document.getElementById('create-btn').style.display = 'none';
            showToast('License created!');
            loadLicenses(); loadStats();
        } else {
            showToast('Error: ' + (lic.detail || JSON.stringify(lic)));
        }
    } catch(e) { showToast('Error: ' + e.message); }
}

function copyKey(el) {
    navigator.clipboard.writeText(el.textContent).then(() => showToast('Key copied!'));
}

// Auto-search on typing
let searchTimeout;
document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(loadLicenses, 400);
});
document.getElementById('status-filter').addEventListener('change', loadLicenses);
</script>
</body>
</html>
